# Fork-Net x4 on REDS: paper hyper-parameters, corrected propagation (recommended for new training).
# For the exact behaviour of the original research code use train_reds_legacy.yaml.
name: forknet_reds
seed: 0
deterministic: false
output_dir: experiments
spynet_path: weights/spynet_sintel_final-3d2a1287.pth
pretrained: null

model:
  num_feat: 64
  num_encoder_blocks: 3
  num_prop_blocks: 5          # 1 entry conv + 4 ConvNeXt blocks per propagation branch
  prop_order: 2
  prop_block: convnext
  use_bsconv: true
  bsconv_fusion: true
  fuse_with_input: false
  bottleneck_mult: 2
  legacy_flow_direction: false
  legacy_backward_index: false
  legacy_flow_scaling: false

data:
  train:
    lr_root: data/REDS/LR_bicubic_X4
    hr_root: data/REDS/HR
    exclude: ["000", "011", "015", "020"]   # REDS4 is the test set
    num_frames: 15
    patch_size: 64
    temporal_sampling: random
    augment: flips
  val:
    lr_root: data/REDS/LR_bicubic_X4
    hr_root: data/REDS/HR
    clips: ["000", "011", "015", "020"]

train:
  total_iters: 300000
  batch_size: 4               # total over all GPUs
  num_workers: 8
  lr: 2.0e-4
  flow_lr_mult: 0.125         # SpyNet lr = 2.5e-5
  betas: [0.9, 0.99]
  weight_decay: 0
  eta_min: 1.0e-7
  fix_flow_iters: 5000        # SpyNet frozen for the first 5k iterations
  amp: true
  loss_eps: 1.0e-8
  grad_clip: null
  log_every: 100
  val_every: 10000
  save_every: 5000

val:
  chunk_size: 15
  overlap: 0
