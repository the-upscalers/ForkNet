# Paired experiment (does fixing the propagation help on plates?): the paper's REDS checkpoint fine-tuned on LP-train
# with the CORRECTED propagation (flow direction, backward frame index, flow scaling).
# Compare with lp_legacy.yaml: identical except the propagation. Evaluate on LP test_clean (no leakage).
base: ../finetune_lp.yaml
name: forknet_lp_corrected
pretrained: auto:paper
seed: 0
train:
  total_iters: 15000
  val_every: 2500
